services:
  # Hardhat Ethereum Node
  hardhat-node:
    build:
      context: .
      dockerfile: docker/Dockerfile.hardhat
    ports:
      - "8545:8545"
    networks:
      - auctra-network
    volumes:
      - ./artifacts:/app/artifacts
      - ./contracts:/app/contracts
      - ./scripts:/app/scripts
      - ./hardhat.config.cjs:/app/hardhat.config.cjs
    command: npx hardhat node --hostname 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Deploy Smart Contracts
  contract-deployer:
    build:
      context: .
      dockerfile: docker/Dockerfile.hardhat
    depends_on:
      hardhat-node:
        condition: service_healthy
    networks:
      - auctra-network
    volumes:
      - ./artifacts:/app/artifacts
      - ./contracts:/app/contracts
      - ./scripts:/app/scripts
      - ./hardhat.config.cjs:/app/hardhat.config.cjs
      - ./src/contracts:/app/src/contracts
    command: >
      sh -c "sleep 10 &&
             npx hardhat run scripts/deploy.js --network localhost &&
             echo 'Smart contracts deployed successfully'"
    restart: "no"

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "3001:3001"
    depends_on:
      hardhat-node:
        condition: service_healthy
    networks:
      - auctra-network
    environment:
      - NODE_ENV=development
      - PORT=3001
    volumes:
      - ./src/contracts:/app/../src/contracts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Next.js App
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - contract-deployer
    networks:
      - auctra-network
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:3001
      - NEXT_PUBLIC_BLOCKCHAIN_URL=http://hardhat-node:8545
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./src/contracts:/app/src/contracts:ro
    command: npm run dev

networks:
  auctra-network:
    driver: bridge

volumes:
  contracts_data: